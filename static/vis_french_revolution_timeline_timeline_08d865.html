<text x="30" y="36" font-size="18" font-weight="700" fill="#0F172A">The French Revolution: Key Historical Milestones (1789-1799)</text>

<text x="158" y="132" font-size="12" font-weight="500" fill="#475569" width="618">King Louis XVI summons the three estates to resolve debt crisis.</text>

<text x="158" y="372" font-size="12" font-weight="500" fill="#475569" width="618">Citizens seize the medieval fortress, launching revolution.</text>

<text x="158" y="492" font-size="12" font-weight="500" fill="#475569" width="618">National Assembly proclaims liberty, equality, fraternity.</text>

<text x="158" y="612" font-size="12" font-weight="500" fill="#475569" width="618">Monarchy formally abolished.</text>

<circle cx="120" cy="705" r="8" fill="#2563EB" />

<text x="158" y="972" font-size="12" font-weight="500" fill="#475569" width="618">Robespierre overthrown; Directory established.</text>
