<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photosynthesis Biochemical Reaction Flowchart</title>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #f8fafc; padding: 24px; margin: 0; }
    </style>
</head>
<body>
    <div class="visual-card flowchart-wrapper" style="background:#fff; border-radius:12px; padding:20px; box-shadow:0 4px 16px rgba(0,0,0,0.06); max-width:860px; margin:auto;">
    <h3 style="margin-top:0; color:#0f172a; font-size:18px;">Photosynthesis Biochemical Reaction Flowchart</h3>
    <p style="color:#475569; font-size:14px; line-height:1.5;">Two-stage photosynthetic reaction cascade.</p>
    <div style="margin-top:16px; border:1px solid #e2e8f0; border-radius:8px; overflow:hidden;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 630" width="100%" height="100%" style="background:#FFFFFF; font-family: system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
<defs>
  <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6" />
  </marker>
  <marker id="flow-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
  </marker>
  <marker id="flow-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
  </marker>
  <filter id="f-shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.07" />
  </filter>
</defs>
<text x="30" y="36" font-size="18" font-weight="700" fill="#0F172A">Photosynthesis Biochemical Reaction Flowchart</text>
<path d="M 410.0 135 V 180" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#flow-arrow)" />
<rect x="418.0" y="147.5" width="70" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
<text x="453.0" y="160.5" font-size="11" font-weight="700" fill="#3B82F6" text-anchor="middle">Photons initiate</text>
<path d="M 410.0 245 V 290" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#flow-arrow)" />
<rect x="418.0" y="257.5" width="70" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
<text x="453.0" y="270.5" font-size="11" font-weight="700" fill="#3B82F6" text-anchor="middle">Electrons transfer</text>
<path d="M 410.0 355 V 400" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#flow-arrow)" />
<rect x="418.0" y="367.5" width="70" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
<text x="453.0" y="380.5" font-size="11" font-weight="700" fill="#3B82F6" text-anchor="middle">ATP + NADPH</text>
<path d="M 410.0 465 V 510" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#flow-arrow)" />
<rect x="418.0" y="477.5" width="70" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
<text x="453.0" y="490.5" font-size="11" font-weight="700" fill="#3B82F6" text-anchor="middle">Sugar synthesis</text>
<rect x="260.0" y="70" width="300" height="65" rx="32.5" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#f-shadow)" />
<text x="410.0" y="100.5" font-size="13" font-weight="700" fill="#1E40AF" text-anchor="middle">Light &amp; Water Absorption</text>
<text x="410.0" y="116.5" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Photons absorbed by Photosystem II</text>
<rect x="260.0" y="180" width="300" height="65" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2" filter="url(#f-shadow)" />
<text x="410.0" y="210.5" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Photolysis of Water</text>
<text x="410.0" y="226.5" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">2H₂O → 4 H⁺ + 4 e⁻ + O₂ released</text>
<rect x="260.0" y="290" width="300" height="65" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2" filter="url(#f-shadow)" />
<text x="410.0" y="320.5" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Electron Transport Chain</text>
<text x="410.0" y="336.5" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Generates ATP and NADPH</text>
<rect x="260.0" y="400" width="300" height="65" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2" filter="url(#f-shadow)" />
<text x="410.0" y="430.5" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Calvin Cycle Carbon Fixation</text>
<text x="410.0" y="446.5" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">CO2 fixed via RuBisCO in stroma</text>
<rect x="260.0" y="510" width="300" height="65" rx="32.5" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" filter="url(#f-shadow)" />
<text x="410.0" y="540.5" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle">Glucose Output &amp; Energy Storage</text>
<text x="410.0" y="556.5" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Produces Glucose (C6H12O6)</text>
</svg>
    </div>
</div>
</body>
</html>
