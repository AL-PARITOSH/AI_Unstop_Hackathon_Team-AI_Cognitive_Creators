<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Search Algorithm Flowchart</title>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #f8fafc; padding: 24px; margin: 0; }
    </style>
</head>
<body>
    <div class="visual-card flowchart-wrapper" style="background:#fff; border-radius:12px; padding:20px; box-shadow:0 4px 16px rgba(0,0,0,0.06); max-width:860px; margin:auto;">
    <h3 style="margin-top:0; color:#0f172a; font-size:18px;">Binary Search Algorithm Flowchart</h3>
    <p style="color:#475569; font-size:14px; line-height:1.5;">Binary Search on sorted array in O(log n) time.</p>
    <div style="margin-top:16px; border:1px solid #e2e8f0; border-radius:8px; overflow:hidden;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1070" width="100%" height="100%" style="background:#FFFFFF; font-family: system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
<defs>
  <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6" />
  </marker>
  <marker id="flow-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
  </marker>
  <marker id="flow-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
  </marker>
  <filter id="f-shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.07" />
  </filter>
</defs>
<text x="30" y="36" font-size="18" font-weight="700" fill="#0F172A">Binary Search Algorithm Flowchart</text>
<path d="M 410.0 135 V 180" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#flow-arrow)" />
<rect x="418.0" y="147.5" width="70" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
<text x="453.0" y="160.5" font-size="11" font-weight="700" fill="#3B82F6" text-anchor="middle">Begin</text>
<path d="M 410.0 245 V 290" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#flow-arrow-green)" />
<rect x="418.0" y="257.5" width="70" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
<text x="453.0" y="270.5" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">True</text>
<path d="M 260.0 212.5 H 210.0 V 982.5 H 255.0" fill="none" stroke="#EF4444" stroke-width="2.5" marker-end="url(#flow-arrow-red)" />
<rect x="165.0" y="587.5" width="65" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
<text x="198.0" y="600.5" font-size="11" font-weight="700" fill="#EF4444" text-anchor="middle">False</text>
<path d="M 410.0 355 V 400" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#flow-arrow)" />
<rect x="418.0" y="367.5" width="70" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
<text x="453.0" y="380.5" font-size="11" font-weight="700" fill="#3B82F6" text-anchor="middle">Check element</text>
<path d="M 410.0 465 V 510" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#flow-arrow-green)" />
<rect x="418.0" y="477.5" width="70" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
<text x="453.0" y="490.5" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">Match</text>
<path d="M 260.0 432.5 H 210.0 V 652.5 H 255.0" fill="none" stroke="#EF4444" stroke-width="2.5" marker-end="url(#flow-arrow-red)" />
<rect x="165.0" y="532.5" width="65" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
<text x="198.0" y="545.5" font-size="11" font-weight="700" fill="#EF4444" text-anchor="middle">No match</text>
<path d="M 410.0 685 V 730" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#flow-arrow-green)" />
<rect x="418.0" y="697.5" width="70" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
<text x="453.0" y="710.5" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">&lt; Target</text>
<path d="M 260.0 652.5 H 210.0 V 872.5 H 255.0" fill="none" stroke="#EF4444" stroke-width="2.5" marker-end="url(#flow-arrow-red)" />
<rect x="165.0" y="752.5" width="65" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
<text x="198.0" y="765.5" font-size="11" font-weight="700" fill="#EF4444" text-anchor="middle">&gt; Target</text>
<path d="M 560.0 762.5 H 615.0 V 212.5 H 565.0" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#flow-arrow)" />
<text x="625.0" y="487.5" font-size="11" font-weight="600" fill="#3B82F6">Loop back</text>
<path d="M 560.0 872.5 H 615.0 V 212.5 H 565.0" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#flow-arrow)" />
<text x="625.0" y="542.5" font-size="11" font-weight="600" fill="#3B82F6">Loop back</text>
<rect x="260.0" y="70" width="300" height="65" rx="32.5" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#f-shadow)" />
<text x="410.0" y="100.5" font-size="13" font-weight="700" fill="#1E40AF" text-anchor="middle">Start: Sorted Array &amp; Target</text>
<text x="410.0" y="116.5" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">low = 0, high = len(arr) - 1</text>
<polygon points="410.0,180 560.0,212.5 410.0,245 260.0,212.5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#f-shadow)" />
<text x="410.0" y="210.5" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">Is low ≤ high ?</text>
<text x="410.0" y="226.5" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Check search space exists</text>
<rect x="260.0" y="290" width="300" height="65" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2" filter="url(#f-shadow)" />
<text x="410.0" y="320.5" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Calculate mid = (low + high) // 2</text>
<text x="410.0" y="336.5" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Midpoint index calculation</text>
<polygon points="410.0,400 560.0,432.5 410.0,465 260.0,432.5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#f-shadow)" />
<text x="410.0" y="430.5" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">Is arr[mid] == Target ?</text>
<text x="410.0" y="446.5" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Target match check</text>
<rect x="260.0" y="510" width="300" height="65" rx="32.5" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" filter="url(#f-shadow)" />
<text x="410.0" y="540.5" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle">Return mid (Found!)</text>
<text x="410.0" y="556.5" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Success</text>
<polygon points="410.0,620 560.0,652.5 410.0,685 260.0,652.5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#f-shadow)" />
<text x="410.0" y="650.5" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">Is arr[mid] &lt; Target ?</text>
<text x="410.0" y="666.5" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Branch direction</text>
<rect x="260.0" y="730" width="300" height="65" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2" filter="url(#f-shadow)" />
<text x="410.0" y="760.5" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">low = mid + 1 (Right)</text>
<text x="410.0" y="776.5" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Search right half</text>
<rect x="260.0" y="840" width="300" height="65" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2" filter="url(#f-shadow)" />
<text x="410.0" y="870.5" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">high = mid - 1 (Left)</text>
<text x="410.0" y="886.5" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Search left half</text>
<rect x="260.0" y="950" width="300" height="65" rx="32.5" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" filter="url(#f-shadow)" />
<text x="410.0" y="980.5" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle">Return -1 (Not Found)</text>
<text x="410.0" y="996.5" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Exhausted</text>
</svg>
    </div>
</div>
</body>
</html>
