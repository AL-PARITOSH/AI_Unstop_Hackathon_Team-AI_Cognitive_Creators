<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newton&#x27;s Second Law Force &amp; Acceleration Diagram</title>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #f8fafc; padding: 24px; margin: 0; }
    </style>
</head>
<body>
    <div class="visual-card diagram-wrapper" style="background:#fff; border-radius:12px; padding:20px; box-shadow:0 4px 16px rgba(0,0,0,0.06); max-width:860px; margin:auto;">
    <h3 style="margin-top:0; color:#0f172a; font-size:18px;">Newton&#x27;s Second Law Force &amp; Acceleration Diagram</h3>
    <p style="color:#475569; font-size:14px; line-height:1.5;">Visualizing force vector acting upon a mass block.</p>
    <div style="margin-top:16px; border:1px solid #e2e8f0; border-radius:8px; overflow:hidden;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background:#FFFFFF; font-family: system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6" />
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B" />
  </marker>
  <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08" />
  </filter>
</defs>
<text x="24" y="36" font-size="17" font-weight="700" fill="#0F172A">Newton&#x27;s Second Law Force &amp; Acceleration Diagram</text>
<path d="M 500 205.0 Q 520.0 195.0 540 205.0" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="480.0" y="184.0" width="80" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
<text x="520.0" y="197.0" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">Applied Force</text>
<path d="M 400.0 160 Q 400.0 125.0 400.0 110" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="360.0" y="114.0" width="80" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
<text x="400.0" y="127.0" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">Accelerates</text>
<rect x="300" y="160" width="200" height="90" rx="10" fill="#E2E8F0" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
<text x="400.0" y="204.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">Mass (m = 10 kg)</text>
<text x="400.0" y="219.0" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">Body</text>
<rect x="540" y="180" width="180" height="50" rx="24" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
<text x="630.0" y="204.0" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">Force (F = 50 N)</text>
<text x="630.0" y="219.0" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">Vector →</text>
<rect x="300" y="60" width="200" height="50" rx="24" fill="#D1FAE5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
<text x="400.0" y="84.0" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">Acceleration (a = 5 m/s²)</text>
<text x="400.0" y="99.0" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">Result →</text>
<g transform="translate(40, 40)">
  <rect x="0" y="0" width="380" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="12" y="16" font-size="11" font-weight="700" fill="#2563EB">Newton&#x27;s 2nd Law</text>
  <text x="12" y="32" font-size="11" font-weight="500" fill="#334155">F = m · a: Force directly creates acceleration.</text>
</g>
</svg>
    </div>
</div>
</body>
</html>
